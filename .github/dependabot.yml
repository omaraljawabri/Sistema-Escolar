version: 2
updates:
  - package-ecosystem: maven
    directory: /
    target-branch: homol
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dependencias-maven:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    target-branch: homol
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ['*']

  - package-ecosystem: docker
    directory: /
    target-branch: homol
    schedule:
      interval: weekly
    groups:
      imagens-docker:
        patterns: ['*']

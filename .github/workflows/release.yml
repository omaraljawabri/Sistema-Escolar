name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/omaraljawabri/sistema-escolar
  JAVA_VERSION: '21'

jobs:
  validar:
    name: Validar tag
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Identificar commit da tag
        id: commit
        run: echo "sha=$(git rev-parse "${GITHUB_REF_NAME}^{commit}")" >> "$GITHUB_OUTPUT"

      - name: Verificar se o commit está na main
        run: |
          if ! git merge-base --is-ancestor "${{ steps.commit.outputs.sha }}" origin/main; then
            echo "::error::A tag ${GITHUB_REF_NAME} precisa apontar para um commit da branch main"
            exit 1
          fi

      - name: Verificar se a tag corresponde à versão do pom.xml
        run: |
          versao_pom=$(./mvnw -B -q help:evaluate -Dexpression=project.version -DforceStdout)
          versao_tag="${GITHUB_REF_NAME#v}"
          if [ "$versao_pom" != "$versao_tag" ]; then
            echo "::error::A tag ${GITHUB_REF_NAME} não corresponde à versão ${versao_pom} do pom.xml"
            exit 1
          fi

  publicar:
    name: Publicar release
    needs: validar
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      IMAGEM_ORIGEM: ghcr.io/omaraljawabri/sistema-escolar:sha-${{ needs.validar.outputs.commit }}
      IMAGEM_RELEASE: ghcr.io/omaraljawabri/sistema-escolar:${{ github.ref_name }}
    steps:
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verificar se a imagem do commit existe
        run: |
          if ! docker buildx imagetools inspect "$IMAGEM_ORIGEM" > /dev/null; then
            echo "::error::A imagem ${IMAGEM_ORIGEM} não existe. A tag deve apontar para um commit que passou pelo pipeline da main."
            exit 1
          fi

      - name: Versionar a imagem sem rebuild
        run: docker buildx imagetools create -t "$IMAGEM_RELEASE" -t "${IMAGE_NAME}:latest" "$IMAGEM_ORIGEM"

      - name: Extrair SBOM da aplicação (CycloneDX)
        run: |
          docker pull "$IMAGEM_RELEASE"
          container=$(docker create "$IMAGEM_RELEASE")
          docker cp "${container}:/app/META-INF/sbom/application.cdx.json" "sbom-aplicacao-${GITHUB_REF_NAME}.cdx.json"
          docker rm "$container"

      - name: Gerar SBOM da imagem (SPDX)
        uses: anchore/sbom-action@v0.24.2
        with:
          image: ${{ env.IMAGEM_RELEASE }}
          format: spdx-json
          output-file: sbom-imagem-${{ github.ref_name }}.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Criar GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          make_latest: true
          fail_on_unmatched_files: true
          files: |
            sbom-aplicacao-${{ github.ref_name }}.cdx.json
            sbom-imagem-${{ github.ref_name }}.spdx.json
          append_body: true
          body: |
            Imagem Docker: `${{ env.IMAGEM_RELEASE }}`
            Commit: ${{ needs.validar.outputs.commit }}

server:
  port: ${PORT:8080}

spring:
  application:
    name: Sistema-Escolar
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/sistema-escolar-db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:no-reply@sistema-escolar.local}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}
          ssl:
            trust: ${spring.mail.host}
api:
  sistema-escolar:
    base-url: ${APP_BASE_URL:http://localhost:8080}
    mail:
      enabled: ${MAIL_ENABLED:true}
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:3000}
    auth:
      token:
        secret: ${AUTH_TOKEN_SECRET}
        expiration-hours: ${AUTH_TOKEN_EXPIRATION_HOURS:2}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
  health:
    mail:
      enabled: false
  info:
    env:
      enabled: true

info:
  app:
    commit: ${APP_COMMIT:local}

springdoc:
  override-with-generic-response: false

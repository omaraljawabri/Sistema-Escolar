spring.application.name=Sistema-Escolar
server.port=${PORT:8080}

# Banco de dados (schema gerenciado pelo Flyway em src/main/resources/db/migration)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/sistema-escolar-db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=validate

# Aplicação
api.sistema-escolar.base-url=${APP_BASE_URL:http://localhost:8080}
api.sistema-escolar.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:3000}
api.sistema-escolar.auth.token.secret=${AUTH_TOKEN_SECRET}
api.sistema-escolar.auth.token.expiration-hours=${AUTH_TOKEN_EXPIRATION_HOURS:2}

# E-mail (padrão: Mailpit local do docker-compose; em produção usar ex. smtp.gmail.com:587 com auth e starttls)
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:no-reply@sistema-escolar.local}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.ssl.trust=${spring.mail.host}

# Actuator: health checks (liveness/readiness) e info da versão implantada
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db
management.health.mail.enabled=false
management.info.env.enabled=true
info.app.commit=${APP_COMMIT:local}

springdoc.override-with-generic-response=false
